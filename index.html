<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B47E0">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fluent Helper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column; sticky header carrying the CEFR scale, fixed 5-tab bar, cards stacked by task */
:root{
  --bg:#F2F4FA;--surface:#FFFFFF;--ink:#151A33;--muted:#596183;--line:#DCE1EE;
  --accent:#2B47E0;--on-accent:#FFFFFF;--accent-soft:#E6EBFF;
  --amber:#B97E00;--amber-soft:#FFF2D2;--good:#167A4C;--good-soft:#E0F4E9;--bad:#BD3328;--bad-soft:#FCE7E4;--on-bad:#FFFFFF;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-ar:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1121;--surface:#161B31;--ink:#E7EAF7;--muted:#99A1C3;--line:#2A3152;
  --accent:#8299FF;--on-accent:#0D1121;--accent-soft:#222A55;
  --amber:#F2B941;--amber-soft:#3A2F12;--good:#52CC91;--good-soft:#123326;--bad:#FF8577;--bad-soft:#3D1A17;--on-bad:#0D1121;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1121;--surface:#161B31;--ink:#E7EAF7;--muted:#99A1C3;--line:#2A3152;
  --accent:#8299FF;--on-accent:#0D1121;--accent-soft:#222A55;
  --amber:#F2B941;--amber-soft:#3A2F12;--good:#52CC91;--good-soft:#123326;--bad:#FF8577;--bad-soft:#3D1A17;--on-bad:#0D1121;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.brand{font:800 20px/1 var(--f-display);letter-spacing:-.02em;margin:0}
.brand span{color:var(--accent)}
.meta{display:flex;align-items:center;gap:10px}
.scale{display:flex;gap:3px}
.scale i{font:500 10px/1 var(--f-mono);font-style:normal;padding:5px 4px;border-radius:4px;background:var(--line);color:var(--muted)}
.scale i.past{background:var(--accent-soft);color:var(--accent)}
.scale i.on{background:var(--accent);color:var(--on-accent)}
.streak{display:flex;align-items:center;gap:3px;font:800 15px/1 var(--f-display);color:var(--amber);font-variant-numeric:tabular-nums}
.streak svg{width:16px;height:16px}

main{max-width:720px;margin:0 auto;display:grid;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 112px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto}
.tab{background:none;border:0;padding:9px 2px 11px;display:grid;justify-items:center;gap:3px;color:var(--muted);font:700 11.5px/1 var(--f-body);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

h1{font:800 clamp(26px,6.4vw,36px)/1.08 var(--f-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
h2{font:700 19px/1.25 var(--f-display);margin:0;text-wrap:balance}
h3{font:700 15px/1.3 var(--f-display);margin:0}
p{margin:0}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;line-height:1.7}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;min-width:0}
.hero{display:grid;gap:10px;padding-block:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:10px;padding:11px 16px;
  background:var(--accent);color:var(--on-accent);font:700 15px/1 var(--f-body);cursor:pointer;min-height:44px;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.rec{background:var(--bad);color:var(--on-bad)}
.btn.sm{padding:7px 11px;min-height:36px;font-size:14px}
.btn svg{width:18px;height:18px}
.ibtn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--accent)}
.ibtn.xs{width:30px;height:30px}
.ibtn svg{width:17px;height:17px}
.ibtn.rec{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font:700 13px/1 var(--f-body);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:16px/1.5 var(--f-body);background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.compose{display:grid;gap:8px}

.steps{display:grid;list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-accent)}
.tick.done{background:var(--good);border-color:var(--good)}
.tick svg{width:14px;height:14px}
.step b{display:block;font-size:15px}
.step small{color:var(--muted);font-size:13px}

.flash{border:1px solid var(--line);border-radius:16px;padding:22px 18px;display:grid;gap:10px;justify-items:center;text-align:center;background:var(--bg)}
.flash .word{font:800 clamp(26px,7vw,34px)/1.1 var(--f-display);letter-spacing:-.02em}
.flash .ex{color:var(--muted)}
.band{font:500 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:4px}
.band.b1{background:var(--good-soft);color:var(--good)}
.band.b2{background:var(--amber-soft);color:var(--amber)}
.band.b3{background:var(--bad-soft);color:var(--bad)}

.vlist{display:grid}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .en{font-weight:700}
.vrow .sub{grid-column:2;font-size:14px;color:var(--muted)}
.vrow .ar{grid-column:2;font-size:14px}
.vrow .acts{grid-row:1/span 3;grid-column:3;display:flex;gap:6px}
.vrow .ibtn{grid-row:1/span 3}
.known{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font:700 12px/1 var(--f-body);cursor:pointer;color:var(--muted)}
.known[aria-pressed="true"]{background:var(--good-soft);color:var(--good);border-color:var(--good-soft)}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.score-row{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}

.chat{display:grid;gap:10px}
.msg{max-width:88%;display:grid;gap:6px;min-width:0}
.msg.ai{justify-self:start}
.msg.me{justify-self:end}
.bubble{padding:10px 13px;border-radius:14px;line-height:1.5;overflow-wrap:anywhere}
.ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.me .bubble{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.fix{background:var(--amber-soft);border-radius:10px;padding:9px 11px;font-size:14px;display:grid;gap:4px}
.fix.blue{background:var(--accent-soft)}
.fix .lbl{font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.fix.blue .lbl{color:var(--accent)}
.ok-note{font-size:13px;color:var(--good);justify-self:end}
.typing{color:var(--muted);font-style:italic;font-size:14px}

.sent{font:700 18px/1.45 var(--f-body)}
.words{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:16px}
.w{padding:1px 6px;border-radius:5px}
.w.ok{background:var(--good-soft);color:var(--good)}
.w.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font:700 12px/1 var(--f-body);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.ipa{font:400 14px/1.6 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}

.notice{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);display:grid;gap:4px}
.err{color:var(--bad);font-size:14px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pair{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;align-content:start}
.pair .sound{font:500 12px/1 var(--f-mono);color:var(--accent)}
.pair .ws{display:flex;gap:6px;flex-wrap:wrap}
.pair button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:6px 9px;font:700 14px var(--f-body);cursor:pointer}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.topic{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:4px;text-align:left;cursor:pointer;align-content:start}
.topic .f{font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.topic b{font:700 16px/1.25 var(--f-display)}
.topic .ar{font-size:13px;color:var(--muted)}
.topic .meter{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.topic .meter i{display:block;height:100%;background:var(--good)}
.topic.today{border-color:var(--accent)}

.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;font:16px/1.4 var(--f-body)}
.opt:hover{border-color:var(--accent)}

.big-level{font:800 64px/1 var(--f-display);letter-spacing:-.04em;color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:5px;background:var(--line)}
.day.part{background:var(--accent-soft)}
.day.full{background:var(--accent)}
.day.today{outline:2px solid var(--amber);outline-offset:1px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{display:grid;gap:2px}
.stats b{font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:13px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:3px}
.feat b{font:700 15px var(--f-display)}
.feat small{color:var(--muted);font-size:13px}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:15px}
label.chk input{margin-top:4px;width:18px;height:18px;flex:none}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.progress i{transition:none}}
@media (max-width:420px){.scale i{padding:5px 3px}.feat{grid-template-columns:1fr}.tab{font-size:10.5px}}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <p class="brand">Fluent<span>Helper</span></p>
  <div class="meta" id="meta"></div>
</div></header>

<main id="app" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/></svg>Today</button>
  <button class="tab" data-tab="talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Talk</button>
  <button class="tab" data-tab="pron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>Pronounce</button>
  <button class="tab" data-tab="topics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Topics</button>
  <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
</div></nav>

<script>
/* Fluent Helper — built-in library. v: [english, arabic, band 1-3, example]  ph: [english, arabic]  dlg lines: ["t"=them | "y"=you, text] */
const TOPICS=[
{id:"daily",field:"Everyday life",title:"Daily routine",ar:"الروتين اليومي",
v:[["wake up","يصحى من النوم",1,"I usually wake up at seven."],["commute","المشوار للشغل",2,"My commute takes about forty minutes."],["chores","أعمال البيت",2,"We share the chores at the weekend."],["grab a bite","ياكل حاجة سريعة",2,"Let's grab a bite before the meeting."],["take a nap","ياخد قيلولة",1,"I sometimes take a nap after lunch."],["get ready","يجهز نفسه",1,"It takes me twenty minutes to get ready."],["tidy up","يرتب",1,"Can you tidy up your room, please?"],["run errands","يخلّص مشاوير",2,"I run errands on Saturday morning."],["unwind","يفصل ويرتاح",3,"I unwind by reading before bed."],["hectic","مزحوم ومتلخبط",3,"Mondays are always hectic for me."],["stick to a routine","يلتزم بروتين",3,"It's hard to stick to a routine during Ramadan."],["oversleep","ينام زيادة",2,"I overslept and missed the bus."]],
ph:[["What does a normal day look like for you?","يومك العادي شكله إيه؟"],["I'm usually up by seven.","عادة بكون صاحي الساعة سبعة."],["I try to get to bed before midnight.","بحاول أنام قبل نص الليل."],["It depends on the day.","على حسب اليوم."],["My mornings are pretty busy.","الصبح عندي مشغول جدًا."],["I like to keep weekends free.","بحب أسيب الويك إند فاضي."]],
dlg:{title:"Talking about your day",you:"yourself",them:"a new friend",lines:[["t","So what does a normal day look like for you?"],["y","I usually wake up at seven and get ready for work."],["t","Nice. How long is your commute?"],["y","It takes about forty minutes by car, sometimes more."],["t","That's long! What do you do after work?"],["y","I go to the gym or spend time with my family."],["t","And weekends?"],["y","I run errands on Saturday and relax on Friday."]]},
pron:["I usually wake up at seven on weekdays.","My commute takes about forty minutes.","I prefer to run errands in the morning.","I unwind by reading before I go to bed."],
ch:["Describe your normal weekday from morning to night.","How has your daily routine changed in the last five years, and is it better now?"]},

{id:"smalltalk",field:"Social",title:"Small talk & making friends",ar:"دردشة وتعارف",
v:[["nice to meet you","تشرفنا",1,"Hi, I'm Sara. Nice to meet you."],["What do you do?","بتشتغل إيه؟",1,"So, what do you do?"],["hang out","يخرج مع حد",1,"We hang out every Thursday."],["catch up","يتقابلوا ويعرفوا أخبار بعض",2,"Let's catch up over coffee soon."],["get along","يتفاهموا",2,"I get along well with my neighbours."],["have a lot in common","بينهم حاجات مشتركة كتير",2,"We have a lot in common."],["break the ice","يكسر الحاجز",3,"A joke can help break the ice."],["keep in touch","يفضلوا على تواصل",2,"Let's keep in touch."],["acquaintance","معرفة (مش صاحب قريب)",3,"He's more of an acquaintance than a friend."],["What brings you here?","إيه اللي جابك هنا؟",2,"So, what brings you here tonight?"],["awkward silence","سكوت محرج",3,"There was an awkward silence."],["small world","الدنيا صغيرة",2,"You know Ahmed too? It's a small world!"]],
ph:[["How do you know the host?","تعرف صاحب العزومة منين؟"],["Have you been here before?","جيت هنا قبل كده؟"],["That sounds interesting! Tell me more.","ده شكله مثير، احكيلي أكتر."],["I don't think we've met.","مش فاكر إننا اتقابلنا."],["It was great talking to you.","اتبسطت إني اتكلمت معاك."],["Let's swap numbers.","يلا نبدّل الأرقام."]],
dlg:{title:"Meeting someone at an event",you:"a guest at an event",them:"another guest",lines:[["t","Hi! I don't think we've met. I'm Omar."],["y","Hi Omar, nice to meet you. I'm Ahmed."],["t","So, how do you know the host?"],["y","We worked together a few years ago."],["t","Oh really? What do you do now?"],["y","I work in sales for a technology company."],["t","That sounds interesting. Do you enjoy it?"],["y","Yes, I do. I meet a lot of new people every week."]]},
pron:["Hi, I don't think we've met before.","What brings you here this evening?","We have a lot in common, actually.","It was really nice talking to you."],
ch:["Introduce yourself to a new person at a party.","What makes small talk easy or difficult for you, and how could you get better at it?"]},

{id:"work",field:"Work",title:"Office & meetings",ar:"المكتب والاجتماعات",

function parseJSONLoose(text){
  try{return JSON.parse(text)}catch(e){}
  const f=text.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=Math.min(...["{","["].map(c=>{const i=text.indexOf(c);return i<0?Infinity:i}));
  const b=Math.max(text.lastIndexOf("}"),text.lastIndexOf("]"));
  if(a<Infinity&&b>a){try{return JSON.parse(text.slice(a,b+1))}catch(e){}}
  throw{code:"invalid_json",text};
}
async function apiJson(input,opts){
  const model=(opts&&opts.modelTier==="quick")?API.quick:API.model;
  const messages=typeof input==="string"?[{role:"user",content:input+"\n\nReply with the JSON only."}]:input;
  let r;
  try{
    r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":API.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:1500,messages})});
  }catch(e){throw{code:"network"}}
  if(!r.ok){
    let msg="";try{msg=(await r.json()).error.message||""}catch(e){}
    if(r.status===401||r.status===403)throw{code:"bad_key"};
    if(r.status===429)throw{code:"rate_limited"};
    if(r.status===404||/model/i.test(msg))throw{code:"bad_model",message:msg};
    if(r.status===400&&/credit|balance|billing/i.test(msg))throw{code:"no_credit"};
    throw{code:"upstream_error",message:msg};
  }
  const d=await r.json();
  const text=(d.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
  return parseJSONLoose(text);
}

let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-US/i.test(v.lang)&&/Google|Samantha|Natural|Aria|Jenny/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let ttsState="unknown"; /* unknown | ok | broken */
function ttsFail(){if(ttsState==="ok"||ttsState==="broken")return;ttsState="broken";render()}
function speak(text,rate){
  if(!text)return;
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){ttsFail();return}
  const ss=window.speechSynthesis;
  try{
    if(ss.speaking||ss.pending)ss.cancel();
    if(!voice)pickVoice();
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate||0.95;
    let started=false;
    u.onstart=()=>{started=true;if(ttsState!=="ok"){ttsState="ok";render()}};
    u.onerror=e=>{if(!started&&e.error!=="interrupted"&&e.error!=="canceled")ttsFail()};
    if(ss.paused)ss.resume();
    ss.speak(u);
    if(ttsState!=="ok")setTimeout(()=>{if(!started)ttsFail()},3000);
  }catch(e){ttsFail()}
}
function ttsNotice(){
  if(ttsState!=="broken")return "";
  return `<div class="notice" role="status"><b>Audio can't play in this window.</b><span>The Claude app's viewer doesn't support speech playback on this device. Open Fluent Helper from GitHub Pages in Chrome or Edge to hear words and sentences.</span><span class="ar">الصوت مش بيشتغل جوه أبلكيشن Claude على الجهاز ده. افتح نسخة GitHub في Chrome عشان تسمع.</span></div>`;
}
function canRec(){return !!SR&&!micBlocked}
function startRec(target,onText,onDone){
  stopRec();
  let r;try{r=new SR()}catch(e){micBlocked=true;render();return}
  r.lang="en-US";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  let finalText="";
  r.onresult=e=>{let t="";for(const res of e.results)t+=res[0].transcript;finalText=t;onText(t)};
  r.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error))micBlocked=true};
  r.onend=()=>{rec=null;recTarget=null;onDone(finalText);render()};
  rec=r;recTarget=target;
  try{r.start()}catch(e){rec=null;recTarget=null;micBlocked=true}
  render();
}
function stopRec(){if(rec){try{rec.stop()}catch(e){}}}
function micBtn(target){

  return `<button class="ibtn ${on?"rec":""}" data-act="mic" data-target="${target}" aria-label="${on?"Stop recording":"Speak your answer"}">${on?I.stop:I.mic}</button>`;
}
function micNotice(){

}

function stepsDone(d){return{vocab:!!d.vocab,dlg:!!d.dlg,pron:d.pron.length>=3,challenge:!!d.challenge}}

    d.complete=true;const k=today();
    if(S.lastDone===shift(k,-1))S.streak=(S.streak||0)+1;else if(S.lastDone!==k)S.streak=1;
    S.lastDone=k;

/* ================= placement: quick (offline) ================= */
function startQuick(){stopRec();Q={i:0,ans:[],result:null};P=null;view="test";render();window.scrollTo(0,0)}
function answerQuick(k){
  Q.ans.push(k);Q.i++;
  if(Q.i>=PLACEMENT.length){
    const by={};LEVELS.forEach(l=>by[l]=0);
    PLACEMENT.forEach((q,i)=>{if(Q.ans[i]===q.a)by[q.l]++});
    const correct=PLACEMENT.filter((q,i)=>Q.ans[i]===q.a).length;
    /* total-score bands: 0-4 A1, 5-7 A2, 8-10 B1, 11-13 B2, 14-16 C1, 17-18 C2 */
    const level=correct>=17?"C2":correct>=14?"C1":correct>=11?"B2":correct>=8?"B1":correct>=5?"A2":"A1";
    S.level=level;
    S.placement={mode:"quick",level,date:today(),correct,total:PLACEMENT.length,by,scores:null,focus:[],strengths:[],corrections:[],summary_ar:""};
    save();Q.result=S.placement;
  }
  render();window.scrollTo(0,0);
}

/* ================= placement: AI interview ================= */
function startPlacement(){stopRec();P={turns:[],q:PT_FIRST,busy:false,err:"",result:null};Q=null;drafts["pt"]="";view="test";render();window.scrollTo(0,0)}
async function sendPlacement(){

  if(!a||P.busy)return;
  stopRec();
  P.turns.push({q:P.q,a});drafts["pt"]="";P.err="";

  P.busy=true;render();
  if(P.turns.length<PT_QUESTIONS){
    const n=P.turns.length+1;
    try{
      const r=await ask(`You are a friendly English speaking examiner running a short placement interview with an Arabic-speaking adult learner from Egypt. The goal is to find their CEFR speaking level.

Interview so far:
${transcript}

Ask question ${n} of ${PT_QUESTIONS}. Adapt the difficulty: if their answers are short, simple or full of errors, ask simpler, concrete questions about daily life. If they answer fluently, move up: past experiences, opinions, comparisons, hypotheticals, and finally abstract topics. Don't repeat a topic. Don't give feedback. One or two natural spoken sentences.
Reply with only JSON: {"question":"..."}`,{modelTier:"quick",cache:false});
      P.q=String(r.question||"").trim()||"Can you tell me about a place you'd love to visit, and why?";
    }catch(e){P.turns.pop();drafts["pt"]=a;P.err=errMsg(e)}
    P.busy=false;render();return;
  }

    const r=await ask(`You are an experienced CEFR speaking examiner. Below is a placement interview with an Arabic-speaking adult learner from Egypt. Answers were typed or dictated through speech-to-text, so ignore spelling, capitals and punctuation. Judge spoken grammar accuracy, vocabulary range, fluency (length and flow) and coherence. Be realistic, not generous.

${transcript}

Reply with only JSON:
{"level":"one of A1, A2, B1, B2, C1, C2","scores":{"fluency":0,"grammar":0,"vocabulary":0,"coherence":0},"strengths":["2-3 short points"],"focus":["3 specific focus areas"],"corrections":[{"original":"something they actually wrote","better":"natural correct version","why_ar":"short reason in simple Arabic"}],"summary_ar":"2 sentences in simple Arabic: their level and what to work on"}
Scores are 0-100. Up to 4 corrections, from their real answers.`,{cache:false});
    const level=LEVELS.includes(String(r.level).toUpperCase())?String(r.level).toUpperCase():"B1";
    S.level=level;
    S.placement={mode:"ai",level,date:today(),scores:r.scores||{},strengths:r.strengths||[],focus:r.focus||[],corrections:r.corrections||[],summary_ar:r.summary_ar||""};
    FC=null;save();P.result=S.placement;

}

/* ================= scripted dialogue ================= */
function startDialogue(tid){
  const t=TBY[tid];
  G={tid,pos:0,ans:{},fb:{},ai:{},done:false,showModel:false};
  advance(false);
}
function advance(sayIt){
  const lines=TBY[G.tid].dlg.lines;
  let said=[];
  while(G.pos<lines.length&&lines[G.pos][0]==="t"){said.push(lines[G.pos][1]);G.pos++}
  if(G.pos>=lines.length){G.done=true;if(G.tid===todayTopic().id){D().dlg=true;checkComplete();save()}}
  if(sayIt&&said.length&&S.autoSpeak)speak(said.join(" "));
}
function contentWords(s){const stop=new Set("the a an to of and or in on at for is are am i you it this that be with my your we they he she was were do does did have has had can could would will not no yes".split(" "));return norm(s).filter(w=>w.length>2&&!stop.has(w))}
function similarity(a,b){const A=new Set(contentWords(a)),B=new Set(contentWords(b));if(!B.size)return 1;let n=0;B.forEach(w=>{if(A.has(w))n++});return n/B.size}
async function sendDialogue(){
  const k="dlg";const text=(drafts[k]||"").trim();if(!text||!G||G.done)return;
  stopRec();
  const lines=TBY[G.tid].dlg.lines;const idx=G.pos;
  G.ans[idx]=text;G.fb[idx]=similarity(text,lines[idx][1]);drafts[k]="";G.showModel=false;
  G.pos++;advance(true);render();scrollEnd();
  if(aiOn()){
    G.ai[idx]={busy:true};render();
    const t=TBY[G.tid];
    const ctx=lines.slice(0,idx).map((l,j)=>(l[0]==="t"?"Other person: "+l[1]:"Learner: "+(G.ans[j]||l[1]))).join("\n");
    try{
      const r=await ask(`An Arabic-speaking learner (CEFR ${lvl()}) is practising a role-play: "${t.dlg.title}". They play ${t.dlg.you}; the other person is ${t.dlg.them}.
Conversation so far:
${ctx}
Learner's reply: "${text}"
Check ONLY the learner's reply for real mistakes in grammar, word choice or unnatural phrasing (ignore punctuation and capitals; it may be speech-to-text). Also say if the reply makes sense in the conversation.
Reply with only JSON: {"correction":null or {"better":"corrected natural version","why_ar":"one short reason in simple Arabic"}}`,{modelTier:"quick",cache:false});
      G.ai[idx]={fix:r.correction&&r.correction.better?r.correction:null};
    }catch(e){G.ai[idx]={err:errMsg(e)}}
    render();
  }
}
function scrollEnd(){requestAnimationFrame(()=>{const el=document.getElementById("talk-end");if(el)el.scrollIntoView({block:"end",behavior:"smooth"})})}

/* ================= AI free chat ================= */
function ensureOpener(){if(!T.msgs.length){const t=todayTopic();T.msgs.push({role:"ai",text:t.dlg.lines[0][1]})}}
async function sendTalk(){
  const text=(drafts["talk"]||"").trim();
  if(!text||T.busy)return;
  stopRec();
  drafts["talk"]="";T.err="";
  const me={role:"me",text,fix:undefined};T.msgs.push(me);T.busy=true;render();scrollEnd();
  const t=todayTopic();
  const hist=T.msgs.slice(-14).map(m=>(m.role==="ai"?"Tutor: ":"Learner: ")+m.text).join("\n");
  try{
    const r=await ask(`You are an English conversation partner and tutor for an Arabic-speaking learner from Egypt at CEFR level ${lvl()}.
Topic: "${t.title}". Role-play: you are ${t.dlg.them}, the learner is ${t.dlg.you}. Try to bring in some of these words naturally: ${t.v.map(w=>w[0]).join(", ")}.
Conversation so far:
${hist}

1. Check ONLY the learner's last message for real mistakes in grammar, word choice or unnatural phrasing. Ignore punctuation and capitals. If it's fine, correction is null.
2. Write your next line: 1-3 short natural sentences at ${lvl()} level, ending with a question.

Reply with only JSON:
{"correction":null or {"better":"corrected natural version of the learner's last message","why_ar":"one short reason in simple Arabic"},"reply":"your next line"}`,{modelTier:"quick",cache:false});
    me.fix=r.correction&&r.correction.better?r.correction:null;
    const reply=String(r.reply||"").trim();
    if(reply){T.msgs.push({role:"ai",text:reply});if(S.autoSpeak)speak(reply)}
  }catch(e){T.msgs.pop();drafts["talk"]=text;T.err=errMsg(e)}
  T.busy=false;render();scrollEnd();
}

/* ================= challenge ================= */
function challengeText(t){return t.ch[hiLevel()?1:0]}
function usedWords(t,text){const low=" "+norm(text).join(" ")+" ";return t.v.filter(w=>low.includes(" "+norm(w[0]).join(" ")+" ")).map(w=>w[0])}
async function sendChallenge(){
  const t=todayTopic();const a=(drafts["ch"]||"").trim();
  if(!a||ui.chBusy)return;
  stopRec();
  const used=usedWords(t,a);
  if(!aiOn()){D().challenge={answer:a,used,mode:"self"};checkComplete();save();render();return}
  ui.chBusy=true;ui.chErr="";render();

/* ================= pronunciation ================= */
function curPronTopic(){return TBY[pronTopic]||todayTopic()}
function norm(s){return String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean)}
function compare(target,heard){
  const a=norm(target),b=norm(heard);
  const dp=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(a.length).fill(false);let i=0,j=0;
  while(i<a.length&&j<b.length){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const out=[];let k=0;
  for(const w of target.split(/\s+/)){const n=norm(w);if(!n.length){out.push({w,ok:true});continue}out.push({w,ok:n.every((_,q)=>ok[k+q])});k+=n.length}
  return{words:out,score:a.length?Math.round(ok.filter(Boolean).length/a.length*100):0};
}
function markPron(key){const d=D();if(!d.pron.includes(key)){d.pron.push(key);checkComplete();save()}}
async function getTips(key,s){
  if(PR.tipBusy[key])return;
  PR.tipBusy[key]=true;PR.tipErr[key]="";render();
  const res=PR.res[key];const missed=res?res.words.filter(w=>!w.ok).map(w=>w.w).join(", "):"";
  try{
    const r=await ask(`Give pronunciation coaching for an Arabic-speaking (Egyptian) learner for this sentence: "${s}"
${missed?`The speech recognizer did not catch these words when they said it: ${missed}. Focus on them.`:""}
Reply with only JSON:
{"ipa":"IPA for the whole sentence, General American","stress":"the sentence with STRESSED syllables in capitals","watch":[{"word":"a word from the sentence","tip_ar":"short tip in simple Arabic about the sound Arabic speakers usually get wrong"}]}
2-4 items in watch.`,{modelTier:"quick"});
    PR.tips[key]=r;
  }catch(e){PR.tipErr[key]=errMsg(e)}
  PR.tipBusy[key]=false;render();
}

      <p class="sent">${esc(s)}</p>
      <div class="row">
        <button class="btn sm ghost" data-act="say" data-text="${esc(s)}">${I.play} Listen</button>
        <button class="btn sm line" data-act="say-slow" data-text="${esc(s)}">${I.slow} Slow</button>
        ${canRec()?`<button class="btn sm ${recOn?"rec":""}" data-act="pron-rec" data-key="${key}" data-s="${esc(s)}">${recOn?I.stop+" Stop":I.mic+" Say it"}</button>`:""}
        ${aiOn()?`<button class="btn sm line" data-act="tips" data-key="${key}" data-s="${esc(s)}" ${PR.tipBusy[key]?"disabled":""}>${PR.tipBusy[key]?'<span class="spin"></span>':"Tips"}</button>`:""}
      </div>
      ${r?`<div class="spread"><div class="words">${r.words.map(w=>`<span class="w ${w.ok?"ok":"miss"}">${esc(w.w)}</span>`).join("")}</div><span class="pill ${r.score>=85?"good":r.score>=60?"mid":"bad"}">${r.score}%</span></div><p class="muted small">Heard: “${esc(r.heard)}”</p>`:""}
      ${!canRec()?`<div class="compose"><label class="eyebrow" for="pd_${key.replace(":","_")}">Say it with your keyboard mic</label>
        <div class="row" style="flex-wrap:nowrap"><textarea id="pd_${key.replace(":","_")}" data-draft="pd_${key}" style="min-height:48px" placeholder="Tap here, then the keyboard mic…">${esc(drafts["pd_"+key]||"")}</textarea>
        <button class="btn sm" data-act="pron-check" data-key="${key}" data-s="${esc(s)}">Check</button></div></div>
        <div class="row"><span class="muted small">How did it go?</span>
        ${["good:Clear","mid:Almost","hard:Hard"].map(x=>{const [v,l]=x.split(":");return `<button class="chip" data-act="self" data-key="${key}" data-v="${v}" aria-pressed="${PR.self[key]===v}">${l}</button>`}).join("")}</div>`:""}
      ${PR.tipErr[key]?`<p class="err">${esc(PR.tipErr[key])}</p>`:""}
      ${tp?`<div class="fix blue">
        ${tp.stress?`<span class="lbl">Stress</span><span>${esc(tp.stress)}</span>`:""}
        ${tp.ipa?`<span class="lbl">IPA</span><span class="ipa">${esc(tp.ipa)}</span>`:""}
        ${(tp.watch||[]).map(w=>`<span><b>${esc(w.word)}</b> <button class="ibtn xs" style="vertical-align:middle" data-act="say-slow" data-text="${esc(w.word)}" aria-label="Listen to ${esc(w.word)}">${I.play}</button></span><span class="ar">${esc(w.tip_ar)}</span>`).join("")}
      </div>`:""}
    </div>`}).join("")}
  ${isToday?"":`<p class="muted small">Practising any topic counts toward today's pronunciation step.</p>`}
  <div class="card">
    <h2>Sounds Arabic speakers mix up</h2>
    <p class="muted small">Tap a word to hear it. Say each pair back to back until they sound different.</p>
    <div class="pairs">${PAIRS.map(p=>`<div class="pair"><span class="sound">${p.s}</span><div class="ws">${p.w.map(w=>`<button data-act="say-slow" data-text="${w}">${w}</button>`).join("")}</div><span class="ar" style="font-size:13px">${p.ar}</span></div>`).join("")}</div>
  </div>`;
}

function vTopics(){
  if(openTopic&&TBY[openTopic])return vTopic(TBY[openTopic]);
  const fields=[...new Set(TOPICS.map(t=>t.field))];
  const tt=S.level?todayTopic().id:null;
  return `<section class="hero"><p class="eyebrow">Library · ${TOPICS.length} topics · ${TOPICS.reduce((n,t)=>n+t.v.length,0)} words</p>
    <h1>Pick a topic</h1><p class="muted">Every topic has vocabulary, phrases, a conversation, pronunciation sentences and a speaking task.</p></section>
  ${fields.map(f=>`<div class="card"><h2>${esc(f)}</h2><div class="tgrid">${TOPICS.filter(t=>t.field===f).map(t=>{const k=topicKnown(t);return `<button class="topic ${t.id===tt?"today":""}" data-act="open-topic" data-id="${t.id}">
      <span class="f">${t.id===tt?"Today's topic":esc(t.field)}</span><b>${esc(t.title)}</b><span class="ar">${esc(t.ar)}</span>
      <span class="muted small">${k}/${t.v.length} words known</span><span class="meter"><i style="width:${k/t.v.length*100}%"></i></span></button>`}).join("")}</div></div>`).join("")}`;
}
function vTopic(t){
  const isToday=S.level&&t.id===todayTopic().id;
  return `<section class="hero">
    <div class="row"><button class="btn line sm" data-act="close-topic">${I.back} All topics</button></div>
    <p class="eyebrow">${esc(t.field)}</p><h1>${esc(t.title)}</h1><p class="ar muted">${esc(t.ar)}</p>
    <div class="row">
      ${isToday?`<span class="pill good">Today's topic</span>`:`<button class="btn" data-act="make-today" data-id="${t.id}">Make it today's topic</button>`}
      <button class="btn ghost" data-act="topic-dialogue" data-id="${t.id}">Practise the conversation</button>
      <button class="btn line" data-act="topic-pron" data-id="${t.id}">Pronunciation</button>
    </div>
  </section>
  <div class="card"><div class="spread"><h2>Vocabulary</h2><span class="muted small">${topicKnown(t)}/${t.v.length} known</span></div>
    <div class="vlist">${t.v.map((w,i)=>{const st=S.words[wkey(t.id,i)];return `<div class="vrow"><span>${sayBtn(w[0],"xs")}</span>
      <span class="en">${esc(w[0])} <span class="band b${w[2]}">${BAND[w[2]]}</span></span>
      <span class="ar">${esc(w[1])}</span><span class="sub">${esc(w[3])}</span>
      <span class="acts"><button class="known" data-act="toggle-known" data-k="${wkey(t.id,i)}" aria-pressed="${st==="known"}">${st==="known"?"Known":"Mark known"}</button></span></div>`}).join("")}</div></div>
  <div class="card"><h2>Phrases</h2><div class="vlist">${t.ph.map(p=>`<div class="vrow"><span>${sayBtn(p[0],"xs")}</span><span class="en">${esc(p[0])}</span><span class="ar">${esc(p[1])}</span></div>`).join("")}</div></div>
  <div class="card"><h2>Conversation: ${esc(t.dlg.title)}</h2><p class="muted small">You: ${esc(t.dlg.you)} · Other person: ${esc(t.dlg.them)}</p>
    <div class="chat">${t.dlg.lines.map(l=>`<div class="msg ${l[0]==="t"?"ai":"me"}"><div class="bubble">${esc(l[1])}</div>${l[0]==="t"?`<div class="row">${sayBtn(l[1],"xs")}</div>`:""}</div>`).join("")}</div>
    <div class="row"><button class="btn line sm" data-act="say" data-text="${esc(t.dlg.lines.map(l=>l[1]).join(" "))}">${I.play} Play the whole conversation</button></div></div>
  <div class="card"><h2>Speaking tasks</h2><ul class="plain">${t.ch.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`;
}

function vProgress(){
  const k=today();
  const cells=[];for(let i=13;i>=0;i--){const key=shift(k,-i);const d=S.days[key];let c="";if(d){c=d.complete?"full":(d.vocab||d.dlg||(d.pron||[]).length||d.challenge)?"part":""}cells.push(`<span class="day ${c} ${i===0?"today":""}" title="${key}"></span>`)}
  const completed=Object.values(S.days).filter(d=>d.complete).length;
  const known=Object.values(S.words).filter(v=>v==="known").length;
  const learning=Object.values(S.words).filter(v=>v==="learning").length;
  return `<section class="hero"><p class="eyebrow">Progress</p><h1>${S.level?`Level ${S.level} · ${LNAME[S.level]}`:"No level yet"}</h1></section>
  <div class="card">
    <div class="stats"><div><b>${liveStreak()}</b><small>Day streak</small></div><div><b>${completed}</b><small>Full days</small></div><div><b>${known}</b><small>Words known${learning?` · ${learning} learning`:""}</small></div></div>
    <span class="eyebrow">Last 14 days</span>
    <div class="days">${cells.join("")}</div>
    <p class="muted small">Dark squares are complete days, light ones are partly done.</p>
  </div>
  ${S.placement?vResult(S.placement,false):""}
  <div class="card">
    <h2>Level</h2>
    <div class="row">
      ${aiOn()?`<button class="btn" data-act="pt-start">Conversation interview (AI)</button>`:""}
      <button class="btn ${aiOn()?"ghost":""}" data-act="q-start">${S.placement?"Retake quick test":"Take quick test"}</button>
    </div>
    <label for="lvl-pick" class="eyebrow">Or set it yourself</label>
    <select id="lvl-pick" data-act="lvl-pick">${S.level?"":`<option value="" selected>Choose a level</option>`}${LEVELS.map(l=>`<option value="${l}" ${l===S.level?"selected":""}>${l} · ${LNAME[l]}</option>`).join("")}</select>
  </div>
  ${vApiCard()}`;
}

function vApiCard(){
  if(window.claude)return "";
  return `<div class="card" id="ai-coach">
    <div class="spread"><h2>AI coach</h2>${API.key?`<span class="pill good">On</span>`:`<span class="pill mid">Off</span>`}</div>
    <p class="muted small">Add your own Anthropic API key to get real conversation, corrections and feedback here. The key is saved only in this browser on this device — it is never in the page or on GitHub. Usage is billed to your API account.</p>
    <p class="ar muted small">المفتاح بيتحفظ في المتصفح ده بس. أي حد تاني يفتح الرابط هيشوف التطبيق من غير AI ومن غير بياناتك.</p>
    <label for="api-key" class="eyebrow">API key</label>
    <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="${API.key?"Saved — paste a new key to replace":"sk-ant-…"}" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:16px var(--f-mono);background:var(--bg);color:var(--ink)">
    <details><summary class="muted small" style="cursor:pointer">Models</summary>
      <div class="compose" style="margin-top:8px">
        <label for="api-model" class="eyebrow">Main model (feedback, placement)</label>
        <input id="api-model" value="${esc(API.model)}" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:15px var(--f-mono);background:var(--bg);color:var(--ink)">
        <label for="api-quick" class="eyebrow">Fast model (chat, tips)</label>
        <input id="api-quick" value="${esc(API.quick)}" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:15px var(--f-mono);background:var(--bg);color:var(--ink)">
      </div></details>
    <div class="row"><button class="btn" data-act="api-save">Save</button>${API.key?`<button class="btn ghost" data-act="api-test">Test</button><button class="btn line" data-act="api-remove">Remove key</button>`:""}</div>
    ${API.status?`<p class="small ${API.status.startsWith("✓")?"":"err"}">${esc(API.status)}</p>`:""}
  </div>`;
}
function render(){
  renderMeta();
  const app=document.getElementById("app");
  const active=document.activeElement&&document.activeElement.id;
  let html;
  if(view==="test"&&(P||Q))html=vTest();
  else if(view==="talk")html=vTalk();
  else if(view==="pron")html=vPron();
  else if(view==="topics")html=vTopics();
  else if(view==="progress")html=vProgress();
  else html=vToday();
  app.innerHTML=ttsNotice()+html;
  if(active){const el=document.getElementById(active);if(el&&el.tagName==="TEXTAREA"){el.focus();el.selectionStart=el.selectionEnd=el.value.length}}
}
function go(v){stopRec();view=v;render();window.scrollTo(0,0)}

/* ================= events ================= */
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.draft;if(k)drafts[k]=e.target.value});
document.addEventListener("change",e=>{
  const a=e.target.dataset&&e.target.dataset.act;
  if(a==="autospeak"){S.autoSpeak=e.target.checked;save()}
  else if(a==="lvl-pick"&&e.target.value){S.level=e.target.value;FC=null;save();render()}
  else if(a==="dlg-topic"){stopRec();startDialogue(e.target.value);drafts["dlg"]="";render()}
  else if(a==="pron-topic"){pronTopic=e.target.value;render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){const id=e.target.id;if(id==="talk")sendTalk();if(id==="pt")sendPlacement();if(id==="ch")sendChallenge();if(id==="dlg")sendDialogue()}
});
document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");
  if(tab){const v=tab.dataset.tab;if(v==="topics"&&view==="topics")openTopic=null;go(v);return}
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT"||b.tagName==="INPUT")return;
  const a=b.dataset.act;
  switch(a){
    case "say":speak(b.dataset.text,0.95);break;
    case "say-slow":speak(b.dataset.text,0.65);break;
    case "q-start":startQuick();break;
    case "q-ans":answerQuick(Number(b.dataset.k));break;
    case "pt-start":startPlacement();break;
    case "pt-send":sendPlacement();break;
    case "test-cancel":P=null;Q=null;go(S.level?"progress":"today");break;
    case "go-today":P=null;Q=null;FC=null;go("today");break;
    case "set-level":S.level=b.dataset.l;FC=null;save();render();break;
    case "fc-reveal":FC.reveal=true;const w=TBY[FC.tid].v[FC.queue[0]];render();speak(w[3]);break;
    case "fc-ok":flashAnswer(true);break;
    case "fc-again":flashAnswer(false);break;
    case "go-dialogue":{const t=todayTopic();talkMode="dialogue";if(!G||G.tid!==t.id||G.done)startDialogue(t.id);go("talk");break}
    case "go-pron":pronTopic=null;go("pron");break;
    case "dlg-send":sendDialogue();break;
    case "dlg-hint":G.showModel=!G.showModel;render();break;
    case "dlg-restart":stopRec();startDialogue(G.tid);drafts["dlg"]="";render();window.scrollTo(0,0);break;
    case "tmode":stopRec();talkMode=b.dataset.m;render();break;
    case "talk-send":sendTalk();break;
    case "talk-reset":T.msgs=[];T.err="";render();break;
    case "ch-send":sendChallenge();break;
    case "ch-redo":drafts["ch"]=D().challenge.answer;D().challenge=null;save();render();break;
    case "tips":getTips(b.dataset.key,b.dataset.s);break;
    case "go-ai":go("progress");requestAnimationFrame(()=>{const el=document.getElementById("ai-coach");if(el)el.scrollIntoView({block:"start"})});break;
    case "api-save":{
      const k=(document.getElementById("api-key").value||"").trim();
      const m=(document.getElementById("api-model")||{}).value,q=(document.getElementById("api-quick")||{}).value;
      if(k)API.key=k;if(m&&m.trim())API.model=m.trim();if(q&&q.trim())API.quick=q.trim();
      try{localStorage.setItem("fh-api-key",API.key);localStorage.setItem("fh-api-model",API.model);localStorage.setItem("fh-api-quick",API.quick)}catch(e){API.status="This browser can't save the key (private mode?)."}
      useApiIfSet();if(!API.status||API.status.startsWith("✓"))API.status=API.key?"Saved. Tap Test to check it.":"Paste a key first.";render();break}
    case "api-test":{API.status="Testing…";render();
      Promise.all([apiJson('Reply with only this JSON: {"ok":true}',{modelTier:"quick"}),apiJson('Reply with only this JSON: {"ok":true}',{})])
        .then(()=>{API.status="✓ Works. Both models answered."}).catch(e=>{API.status=errMsg(e)}).finally(render);break}
    case "api-remove":API.key="";API.status="Key removed from this browser.";try{localStorage.removeItem("fh-api-key")}catch(e){}useApiIfSet();render();break;
    case "pron-check":{const key=b.dataset.key;const heard=(drafts["pd_"+key]||"").trim();if(!heard)break;const c=compare(b.dataset.s,heard);PR.res[key]={...c,heard};markPron(key);render();break}
    case "self":PR.self[b.dataset.key]=b.dataset.v;markPron(b.dataset.key);render();break;
    case "open-topic":openTopic=b.dataset.id;render();window.scrollTo(0,0);break;
    case "close-topic":openTopic=null;render();window.scrollTo(0,0);break;
    case "make-today":setTodayTopic(b.dataset.id);openTopic=null;go("today");break;
    case "topic-dialogue":talkMode="dialogue";startDialogue(b.dataset.id);drafts["dlg"]="";go("talk");break;
    case "topic-pron":pronTopic=b.dataset.id;go("pron");break;
    case "toggle-known":{const k=b.dataset.k;S.words[k]=S.words[k]==="known"?"learning":"known";save();render();break}
    case "mic":{
      const t=b.dataset.target;
      if(recTarget===t){stopRec();break}
      const base=(drafts[t]||"").trim();
      startRec(t,txt=>{drafts[t]=(base?base+" ":"")+txt;const el=document.getElementById(t);if(el)el.value=drafts[t]},()=>{});
      break}
    case "pron-rec":{
      const key=b.dataset.key,s=b.dataset.s,tgt="pr:"+key;
      if(recTarget===tgt){stopRec();break}
      startRec(tgt,()=>{},heard=>{if(heard){const c=compare(s,heard);PR.res[key]={...c,heard};markPron(key)}});
      break}
  }
});

render();
initRuntime();
</script>

</body>
</html>
